# This repo's own pipeline: the slot keeper's tests and a lint of the workflows.
name: pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: slot-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  slot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Keeper picks
        run: slot/test.sh
      - name: Lint workflows
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12 && ./actionlint -color
